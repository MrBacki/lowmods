<!DOCTYPE html>
<html lang="de" data-theme="night">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LowMods – Minecraft Mods</title>
<style>
  /* ===== Themes ===== */
  :root, [data-theme="aqua"]{
    --bg-a:#bff7f0; --bg-b:#a5f0ff; --bg-c:#e9fffc; --bg-d:#c9f8f1;
    --blob-1:#5eead4; --blob-2:#22d3ee; --blob-3:#7dd3fc; --blob-op:.45;
    --surface:#ffffff; --surface-glass:rgba(255,255,255,.88); --nav:rgba(255,255,255,.55);
    --tint:#d4faf5; --tint-2:#effefc; --border:#a8f3ea;
    --ink:#0a3d45; --muted:#4f7f87; --text-2:#2f5f66;
    --accent:#14b8a6; --accent-2:#06b6d4; --accent-ink:#0d9488;
    --on-accent:#ffffff; --shadow:0 10px 30px -12px rgba(8,145,178,.35);
    color-scheme:light;
  }
  [data-theme="ocean"]{
    --bg-a:#b9dcff; --bg-b:#8fd3f0; --bg-c:#eef7ff; --bg-d:#d6ebfb;
    --blob-1:#38bdf8; --blob-2:#60a5fa; --blob-3:#818cf8; --blob-op:.4;
    --surface:#ffffff; --surface-glass:rgba(255,255,255,.9); --nav:rgba(255,255,255,.6);
    --tint:#dbeafe; --tint-2:#eff6ff; --border:#bfdbfe;
    --ink:#0c2a4a; --muted:#4b6b8a; --text-2:#334e68;
    --accent:#0ea5e9; --accent-2:#2563eb; --accent-ink:#0369a1;
    --on-accent:#ffffff; --shadow:0 10px 30px -12px rgba(37,99,235,.35);
    color-scheme:light;
  }
  [data-theme="mint"]{
    --bg-a:#c6f6e0; --bg-b:#9ee8d0; --bg-c:#f0fdf9; --bg-d:#d5f5ea;
    --blob-1:#6ee7b7; --blob-2:#34d399; --blob-3:#a7f3d0; --blob-op:.45;
    --surface:#ffffff; --surface-glass:rgba(255,255,255,.9); --nav:rgba(255,255,255,.6);
    --tint:#d1fae5; --tint-2:#ecfdf5; --border:#a7f3d0;
    --ink:#053b2b; --muted:#4d7c6a; --text-2:#2d5f4c;
    --accent:#10b981; --accent-2:#059669; --accent-ink:#047857;
    --on-accent:#ffffff; --shadow:0 10px 30px -12px rgba(5,150,105,.35);
    color-scheme:light;
  }
  [data-theme="night"]{
    --bg-a:#0b3d47; --bg-b:#0e4b57; --bg-c:#041d22; --bg-d:#02171b;
    --blob-1:#14b8a6; --blob-2:#0891b2; --blob-3:#155e75; --blob-op:.3;
    --surface:#0d3138; --surface-glass:rgba(13,49,56,.88); --nav:rgba(4,30,36,.65);
    --tint:#134e4a; --tint-2:#0f3b40; --border:#1f6f6b;
    --ink:#d5fbf7; --muted:#8fc7c4; --text-2:#b8ece8;
    --accent:#2dd4bf; --accent-2:#22d3ee; --accent-ink:#5eead4;
    --on-accent:#03262b; --shadow:0 10px 30px -12px rgba(0,0,0,.6);
    color-scheme:dark;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    color:var(--ink); line-height:1.5; min-height:100vh; overflow-x:hidden;
    background:
      radial-gradient(1200px 600px at 10% -10%, var(--bg-a) 0%, transparent 60%),
      radial-gradient(900px 500px at 110% 10%, var(--bg-b) 0%, transparent 60%),
      linear-gradient(180deg, var(--bg-c) 0%, var(--bg-d) 100%);
    background-attachment:fixed;
    transition:background .5s ease, color .5s ease;
  }
  a{color:var(--accent-ink);text-decoration:none}
  button,input,select,textarea{font:inherit;color:var(--ink)}

  .blob{position:fixed;width:440px;height:440px;border-radius:50%;filter:blur(70px);opacity:var(--blob-op);z-index:-1;pointer-events:none;animation:float 16s ease-in-out infinite}
  .b1{background:var(--blob-1);top:-140px;left:-140px}
  .b2{background:var(--blob-2);top:30%;right:-160px;animation-delay:-5s}
  .b3{background:var(--blob-3);bottom:-180px;left:30%;animation-delay:-9s}
  @keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,-30px) scale(1.08)}}

  /* ===== Navigation ===== */
  .nav{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:18px;padding:14px 24px;
       background:var(--nav);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
       border-bottom:1px solid var(--border);flex-wrap:wrap}
  .brand{font-weight:900;font-size:1.5rem;letter-spacing:-.5px;display:inline-block;
         background:linear-gradient(90deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .brand.big{font-size:2.2rem}
  .navlinks{display:flex;gap:6px;margin-left:12px}
  .navlinks a{padding:8px 14px;border-radius:10px;color:var(--ink);font-weight:600;transition:background .2s,color .2s}
  .navlinks a:hover{background:var(--tint)}
  .navlinks a.active{background:var(--surface);box-shadow:0 2px 8px rgba(0,0,0,.08);color:var(--accent-ink)}
  .spacer{flex:1}
  .icon-btn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;color:var(--accent-ink);border:2px solid transparent;transition:background .2s,transform .3s}
  .icon-btn svg{width:20px;height:20px}
  .icon-btn:hover{background:var(--tint);transform:rotate(30deg)}
  .icon-btn.active{background:var(--surface);border-color:var(--border)}
  .authbox{display:flex;align-items:center;gap:10px;color:var(--ink)}
  .avatar{width:36px;height:36px;border-radius:12px;display:inline-grid;place-items:center;color:#fff;font-weight:800;flex-shrink:0}
  .avatar.sm{width:28px;height:28px;border-radius:9px;font-size:.8rem;margin-right:8px;vertical-align:middle}
  .avatar.xl{width:72px;height:72px;border-radius:22px;font-size:1.8rem}

  main{max-width:1200px;margin:0 auto;padding:32px 20px 90px}
  .page{animation:fadeUp .45s ease both}
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

  /* ===== Buttons ===== */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer;
       padding:11px 18px;border-radius:12px;font-weight:700;color:var(--on-accent);text-decoration:none;
       background:linear-gradient(135deg,var(--accent),var(--accent-2));
       box-shadow:0 8px 20px -8px var(--accent-2);transition:transform .2s,box-shadow .2s}
  .btn:hover{transform:translateY(-2px);box-shadow:0 14px 26px -10px var(--accent-2)}
  .btn:active{transform:translateY(0) scale(.98)}
  .btn.ghost{background:var(--surface-glass);color:var(--accent-ink);box-shadow:none;border:2px solid var(--border)}
  .btn.ghost:hover{background:var(--surface);border-color:var(--accent)}
  .btn.danger{background:linear-gradient(135deg,#fb7185,#e11d48);color:#fff;box-shadow:0 8px 20px -8px rgba(225,29,72,.6)}
  .btn.small{padding:7px 12px;font-size:.88rem;border-radius:10px}

  /* ===== Karten & Typo ===== */
  .card{background:var(--surface-glass);border-radius:18px;box-shadow:var(--shadow);padding:24px;border:1px solid var(--surface)}
  .muted{color:var(--muted)}
  .title{font-size:2rem;font-weight:900;letter-spacing:-.6px;line-height:1.15}
  .title.small{font-size:1.6rem}
  .sub{font-size:1.15rem;font-weight:800;margin-top:24px}
  .lead{font-size:1.05rem;color:var(--text-2);margin-top:14px}
  .hint{font-size:.8rem;color:var(--muted)}
  .center{text-align:center}
  .narrow{max-width:760px;margin:0 auto}
  .empty{text-align:center;padding:50px 20px;color:var(--muted)}
  .nowrap{white-space:nowrap}
  .banner{padding:14px 16px;border-radius:14px;margin-top:14px;font-weight:600;font-size:.95rem}
  .banner.pending{background:#fef3c7;color:#854d0e}
  .banner.rejected{background:#ffe4e6;color:#9f1239}
  .btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}

  /* ===== Hero & Suche ===== */
  .hero{text-align:center;padding:40px 10px 26px}
  .hero h1{font-size:clamp(2rem,5vw,3.4rem);font-weight:900;letter-spacing:-1px;line-height:1.1}
  .hero h1 span{background:linear-gradient(90deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero p{margin-top:12px;color:var(--muted);font-size:1.1rem}
  .searchbar{margin:26px auto 0;max-width:640px;position:relative}
  .searchbar input{width:100%;padding:16px 20px 16px 52px;border-radius:999px;border:2px solid transparent;background:var(--surface);
                   box-shadow:var(--shadow);font-size:1.05rem;outline:none;transition:box-shadow .2s,border-color .2s}
  .searchbar input:focus{border-color:var(--accent-2);box-shadow:0 0 0 6px rgba(6,182,212,.18)}
  .searchbar svg{position:absolute;left:18px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--accent);pointer-events:none}
  .stats{display:flex;gap:14px;justify-content:center;margin-top:22px;flex-wrap:wrap}
  .stat{background:var(--surface-glass);padding:10px 18px;border-radius:14px;font-weight:700;color:var(--accent-ink);box-shadow:0 4px 14px -8px var(--accent-2)}

  .toolbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:18px 0 22px}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{border:1px solid var(--border);cursor:pointer;padding:8px 14px;border-radius:999px;background:var(--surface-glass);font-weight:600;transition:transform .2s,background .2s,color .2s}
  .chip:hover{transform:translateY(-1px)}
  .chip.on{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--on-accent);border-color:transparent;box-shadow:0 6px 16px -8px var(--accent-2)}
  .select{padding:9px 12px;border-radius:12px;border:2px solid var(--border);background:var(--surface);outline:none;cursor:pointer}

  /* ===== Mod-Karten ===== */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px}
  .modcard{display:flex;flex-direction:column;gap:12px;color:var(--ink);transition:transform .25s,box-shadow .25s;animation:fadeUp .5s ease both}
  .modcard:hover{transform:translateY(-5px);box-shadow:0 20px 40px -14px var(--accent-2)}
  .modhead{display:flex;gap:14px;align-items:center}
  .icon{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;color:#fff;font-weight:900;font-size:1.5rem;flex-shrink:0;box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
  .icon.big{width:84px;height:84px;font-size:2.4rem;border-radius:22px}
  .modname{font-weight:800;font-size:1.1rem;line-height:1.2}
  .by{font-size:.85rem;color:var(--muted)}
  .summary{color:var(--text-2);font-size:.95rem;flex:1}
  .tags{display:flex;gap:6px;flex-wrap:wrap}
  .tag{font-size:.75rem;padding:4px 9px;border-radius:999px;background:var(--tint);color:var(--accent-ink);font-weight:700}
  .modfoot{display:flex;justify-content:space-between;color:var(--muted);font-size:.88rem;border-top:1px dashed var(--border);padding-top:10px}

  /* ===== Detailseite ===== */
  .detail{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:22px;margin-top:18px}
  .side{align-self:start;position:sticky;top:96px}
  .desc{white-space:pre-wrap;line-height:1.7;color:var(--text-2);margin-top:12px}
  .infolist{display:grid;gap:12px}
  .infolist div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--border);padding-bottom:8px;font-size:.95rem}
  .infolist b{color:var(--muted);font-weight:600}

  /* ===== Formulare ===== */
  .tabs{display:flex;gap:4px;background:var(--tint);border-radius:14px;padding:5px;margin-bottom:22px}
  .tabs button{flex:1;border:0;background:transparent;padding:10px;border-radius:10px;font-weight:700;color:var(--muted);cursor:pointer;transition:background .2s,color .2s}
  .tabs button.on{background:var(--surface);color:var(--accent-ink);box-shadow:0 4px 12px -6px var(--accent-2)}
  .version-list{display:grid;gap:10px;margin-top:14px}
  .version-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:13px 14px;border:1px solid var(--border);border-radius:13px;background:var(--surface-glass)}
  .version-meta{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .version-meta strong{font-size:.98rem}
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
  .field label{font-weight:700;font-size:.9rem}
  .field input,.field textarea,.field select{width:100%;padding:12px 14px;border-radius:12px;border:2px solid var(--border);background:var(--surface);outline:none;transition:border-color .2s,box-shadow .2s}
  .field input[type=file]{padding:10px;cursor:pointer}
  .field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent-2);box-shadow:0 0 0 4px rgba(6,182,212,.15)}
  .field textarea{min-height:140px;resize:vertical}
  .row{display:flex;gap:14px;flex-wrap:wrap}
  .row > .field{flex:1;min-width:200px}
  .error{display:none;background:#fff1f2;color:#be123c;border:1px solid #fecdd3;padding:10px 12px;border-radius:12px;margin-bottom:16px;font-weight:600;font-size:.92rem}
  .error.show{display:block;animation:shake .4s ease}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .auth{padding:30px}
  .auth-brand{text-align:center;margin-bottom:18px}

  /* ===== Profil, Modpacks, Admin, Einstellungen ===== */
  .duo{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  .profile-head{display:flex;align-items:center;gap:16px}
  .badge{padding:3px 10px;border-radius:999px;font-size:.78rem;font-weight:800;display:inline-block;margin-top:6px;white-space:nowrap}
  .badge.admin{background:linear-gradient(135deg,#fde68a,#f59e0b);color:#78350f}
  .badge.user{background:var(--tint);color:var(--accent-ink)}
  .badge.st-approved{background:var(--tint);color:var(--accent-ink)}
  .badge.st-pending{background:#fef3c7;color:#854d0e}
  .badge.st-rejected{background:#ffe4e6;color:#9f1239}
  .grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px}
  .kpi{display:flex;flex-direction:column;gap:6px}
  .kpi span{color:var(--muted);font-weight:700;font-size:.82rem;text-transform:uppercase;letter-spacing:.5px}
  .kpi b{font-size:2rem;font-weight:900;background:linear-gradient(90deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .tablewrap{overflow-x:auto;padding:12px}
  .table{width:100%;border-collapse:collapse;font-size:.93rem}
  .table th,.table td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--tint);vertical-align:middle}
  .table th{color:var(--muted);font-weight:700;font-size:.8rem;text-transform:uppercase;letter-spacing:.5px}
  .table tbody tr:hover td{background:var(--tint-2)}
  .pw{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--tint-2);padding:4px 8px;border-radius:8px;border:1px solid var(--border);display:inline-block;min-width:110px}

  .picks{display:grid;gap:8px;max-height:320px;overflow:auto;padding:4px}
  .pick{display:flex;gap:10px;align-items:center;background:var(--surface);border:2px solid var(--border);border-radius:12px;padding:10px 12px;cursor:pointer;transition:border-color .2s,background .2s}
  .pick:has(input:checked){border-color:var(--accent-2);background:var(--tint-2)}
  .pick input{accent-color:var(--accent);width:18px;height:18px}
  .pick-body{display:flex;flex-direction:column}
  .packlist{display:grid;gap:12px}
  .packitem{border:1px solid var(--border);border-radius:14px;padding:14px;background:var(--surface)}
  .warn{color:#b45309;font-size:.85rem;font-weight:700;margin-top:6px}

  .theme-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
  .theme-card{border:2px solid var(--border);background:var(--surface);border-radius:16px;padding:12px;cursor:pointer;text-align:left;color:var(--ink);transition:transform .2s,border-color .2s,box-shadow .2s}
  .theme-card:hover{transform:translateY(-3px)}
  .theme-card.on{border-color:var(--accent-2);box-shadow:0 0 0 4px rgba(6,182,212,.18)}
  .swatch{height:64px;border-radius:12px;display:block;margin-bottom:10px}
  .sw-aqua{background:linear-gradient(135deg,#bff7f0,#14b8a6 55%,#06b6d4)}
  .sw-ocean{background:linear-gradient(135deg,#b9dcff,#0ea5e9 55%,#2563eb)}
  .sw-mint{background:linear-gradient(135deg,#c6f6e0,#10b981 55%,#059669)}
  .sw-night{background:linear-gradient(135deg,#0b3d47,#2dd4bf 60%,#0891b2)}

  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(140px);background:var(--ink);color:var(--surface);
         padding:12px 20px;border-radius:14px;box-shadow:0 14px 30px -10px rgba(0,0,0,.4);
         transition:transform .45s cubic-bezier(.2,.9,.3,1.2);z-index:100;font-weight:600;max-width:90vw;text-align:center}
  .toast.show{transform:translateX(-50%) translateY(0)}
  .hidden{display:none !important}

  @media (max-width:800px){
    .detail,.duo{grid-template-columns:1fr}
    .side{position:static}
  }
  @media (max-width:700px){
    .nav{padding:12px 16px;gap:12px}
    .navlinks{order:3;width:100%;margin-left:0;overflow-x:auto}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none !important;transition:none !important;scroll-behavior:auto !important}
  }

  /* ===== LowMods dark gaming refresh ===== */
  [data-theme="night"]{
    --bg-a:#101b1a;--bg-b:#13241f;--bg-c:#090d0d;--bg-d:#0d1212;
    --blob-1:#00e676;--blob-2:#00bfa5;--blob-3:#36f1cd;--blob-op:.16;
    --surface:#151c1c;--surface-glass:rgba(20,28,28,.88);--nav:rgba(10,15,16,.82);
    --tint:#18352d;--tint-2:#12251f;--border:#29463b;
    --ink:#f1f7f4;--muted:#9aaca5;--text-2:#c5d2cc;
    --accent:#18df78;--accent-2:#00bfa5;--accent-ink:#51efa0;
    --on-accent:#04130b;--shadow:0 14px 42px -20px rgba(0,230,118,.32);
    color-scheme:dark;
  }
  body{background:radial-gradient(ellipse at 50% 0%,color-mix(in srgb,var(--accent) 12%,transparent),transparent 38%),linear-gradient(180deg,var(--bg-c),var(--bg-d) 60%,var(--bg-c));background-attachment:fixed}
  .nav{background:var(--nav);border-bottom:1px solid var(--border);backdrop-filter:blur(18px)}
  .brand{background:linear-gradient(90deg,#22e879,#5ef0c2);-webkit-background-clip:text;background-clip:text}
  .navlinks a{color:var(--ink)}
  .navlinks a:hover,.navlinks a.active{background:var(--tint);color:var(--accent-ink)}
  main{max-width:1380px;padding-top:24px}
  .hero{
    position:relative;isolation:isolate;overflow:hidden;text-align:center;
    padding:72px 22px 42px;margin:18px 0 28px;border:1px solid rgba(83,130,108,.22);
    border-radius:30px;background:
      radial-gradient(ellipse at 50% 0%,color-mix(in srgb,var(--accent) 18%,transparent),transparent 54%),
      linear-gradient(145deg,var(--surface-glass),var(--surface));
    box-shadow:var(--shadow)
  }
  .hero:before,.hero:after{content:"";position:absolute;z-index:-1;pointer-events:none;border:1px solid rgba(35,220,125,.12);border-radius:50%}
  .hero:before{width:460px;height:460px;left:-220px;top:-290px;box-shadow:0 0 0 35px rgba(35,220,125,.025),0 0 0 80px rgba(35,220,125,.018)}
  .hero:after{width:540px;height:540px;right:-300px;bottom:-430px;box-shadow:0 0 0 45px rgba(35,220,125,.025),0 0 0 95px rgba(35,220,125,.018)}
  .hero-mark{width:76px;height:76px;margin:0 auto 22px;border-radius:24px;display:grid;place-items:center;color:#06140c;font-size:2.1rem;font-weight:950;background:linear-gradient(145deg,#3bf28c,#00bfa5);box-shadow:0 12px 38px rgba(0,230,118,.24);transform:rotate(-7deg)}
  .hero-eyebrow{display:inline-flex;align-items:center;gap:8px;padding:7px 13px;border:1px solid rgba(50,230,140,.28);border-radius:999px;background:rgba(18,70,47,.3);color:#7af0ad;font-size:.78rem;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;margin-bottom:22px}
  .hero h1{max-width:950px;margin:auto;font-size:clamp(2.5rem,6.4vw,5.2rem);font-weight:950;letter-spacing:-2.5px;line-height:1.02;color:var(--ink)}
  .hero h1 span{display:block;margin-top:8px;background:linear-gradient(90deg,#28e879,#36d6b4 60%,#7bf0b1);-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero p{max-width:700px;margin:22px auto 0;color:var(--muted);font-size:clamp(1rem,2vw,1.18rem);line-height:1.7}
  .hero-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:27px}

  /* =====================================================
     Speicher & Einstellungen
     ===================================================== */
  function read(key, fallback) {
    try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }
    catch (e) { return fallback; }
  }
  function write(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); }
    catch (e) { toast(t('err.storage')); }
  }

  let settings = Object.assign({ theme: 'night', lang: 'de' }, read(KEYS.settings, {}));
  if (!THEMES.includes(settings.theme)) settings.theme = 'night';
  if (!LANGS.includes(settings.lang)) settings.lang = 'de';
  function saveSettings() { write(KEYS.settings, settings); }
  function applySettings() {
    document.documentElement.dataset.theme = settings.theme;
    document.documentElement.lang = settings.lang;
  }

  function t(key, vars) {
    const dict = I18N[settings.lang] || I18N.de;
    let s = dict[key] != null ? dict[key] : (I18N.de[key] != null ? I18N.de[key] : key);
    if (vars) for (const k in vars) s = s.split('{' + k + '}').join(String(vars[k]));
    return s;
  }
  function locale() { return ({de:'de-DE',en:'en-US',fr:'fr-FR',es:'es-ES',pt:'pt-PT',pl:'pl-PL',tr:'tr-TR',nl:'nl-NL'})[settings.lang] || 'en-US'; }

  let users = read(KEYS.users, []);
  let mods = read(KEYS.mods, []);
  let modpacks = read(KEYS.packs, []);
  function saveUsers() { write(KEYS.users, users); }
  function saveMods() { write(KEYS.mods, mods); }
  function savePacks() { write(KEYS.packs, modpacks); }

  // Alte Daten (frühere Version) ins neue Format bringen
  function migrate() {
    mods.forEach(m => {
      if (LEGACY_CAT[m.category]) m.category = LEGACY_CAT[m.category];
      if (OLD_CAT[m.category]) m.category = OLD_CAT[m.category];
      if (!CATS.includes(m.category)) m.category = 'utility';
      if (!m.status) m.status = 'approved';
      if (m.hasFile === undefined) m.hasFile = false;
      const s = SEEDS.find(x => x.id === m.id);
      if (s && !m.loc) m.loc = { de: s.de, en: s.en };
    });
    saveMods();
  }

  function seed() {
    if (!users.some(u => u.name.toLowerCase() === ADMIN_NAME)) {
      users.push({ name: 'lwt4', password: ADMIN_PASSWORD, created: Date.now() });
    }
    if (!localStorage.getItem(KEYS.seeded)) {
      const now = Date.now();
      if (!mods.length) mods = SEEDS.map((s, i) => ({
        id: s.id, name: s.name, summary: s.de.summary, description: s.de.description,
        loc: { de: s.de, en: s.en }, category: s.category, loader: s.loader, version: s.version,
        downloads: s.downloads, url: '', author: 'LowTeam', status: 'approved',
        created: now - i * 3 * DAY, hasFile: false, fileName: '', fileSize: 0
      }));
      localStorage.setItem(KEYS.seeded, '1');
    }
    saveUsers();
  }

  /* =====================================================
     Dateien (IndexedDB) für hochgeladene .jar / .zip
     ===================================================== */
  let dbPromise = null;
  function db() {
    if (!dbPromise) {
      dbPromise = new Promise((resolve, reject) => {
        if (!('indexedDB' in window)) return reject(new Error('no indexedDB'));
        const req = indexedDB.open('lowmods.files.v1', 1);
        req.onupgradeneeded = () => req.result.createObjectStore('files');
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => { dbPromise = null; reject(req.error); };
      });
    }
    return dbPromise;
  }
  async function idbRun(mode, fn) {
    const d = await db();
    return new Promise((resolve, reject) => {
      const tx = d.transaction('files', mode);
      const req = fn(tx.objectStore('files'));
      tx.oncomplete = () => resolve(req ? req.result : undefined);
      tx.onerror = () => reject(tx.error);
      tx.onabort = () => reject(tx.error);
    });
  }
  const putFile = (id, blob) => idbRun('readwrite', st => st.put(blob, id));
  const getFile = id => idbRun('readonly', st => st.get(id));
  const delFile = id => idbRun('readwrite', st => st.delete(id)).catch(() => {});

  /* =====================================================
     Hilfsfunktionen
     ===================================================== */
  const $ = sel => document.querySelector(sel);
  function esc(v) {
    return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function fmt(n) { return new Intl.NumberFormat(locale()).format(n || 0); }
  function fmtDate(ts) { return new Date(ts).toLocaleDateString(locale(), { day: '2-digit', month: '2-digit', year: 'numeric' }); }
  function timeAgo(ts) {
    const d = Math.floor((Date.now() - ts) / DAY);
    if (d <= 0) return t('time.today');
    if (d === 1) return t('time.yesterday');
    if (d < 30) return t('time.days', { n: d });
    const m = Math.floor(d / 30);
    if (m < 12) return t(m === 1 ? 'time.month' : 'time.months', { n: m });
    const y = Math.floor(m / 12);
    return t(y === 1 ? 'time.year' : 'time.years', { n: y });
  }
  function gradientFor(str) {
    let h = 0;
    for (const ch of String(str)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
    const hue = 165 + (h % 50);
    return `linear-gradient(135deg, hsl(${hue} 85% 50%), hsl(${hue + 25} 90% 38%))`;
  }
  function initial(str) { return esc((String(str || '?').trim().charAt(0) || '?').toUpperCase()); }
  function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36); }
  function safeFileName(s) { return String(s).replace(/[^\w.\-]+/g, '_').replace(/^_+|_+$/g, '') || 'file'; }
  function catLabel(c) { return t('cat.' + (CATS.includes(c) ? c : 'other')); }
  function opts(arr, labelFn) {
    return arr.map(v => `<option value="${esc(v)}">${esc(labelFn ? labelFn(v) : v)}</option>`).join('');
  }
  function T(m, field) {
    const l = m.loc && m.loc[settings.lang];
    return (l && l[field]) || m[field] || '';
  }
  function statusOf(m) { return m.status || 'approved'; }
  function sameName(a, b) { return String(a).toLowerCase() === String(b).toLowerCase(); }
  function statusBadge(m) {
    const s = statusOf(m);
    return `<span class="badge st-${s}">${esc(t('status.' + s))}</span>`;
  }
  function showError(id, msg) {
    const el = $('#' + id);
    if (!el) return;
    el.textContent = msg;
    el.classList.remove('show');
    void el.offsetWidth;
    el.classList.add('show');
  }
  let toastTimer = null;
  function toast(msg) {
    const el = $('#toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
  }
  function triggerDownload(blob, name) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }

  /* =====================================================
     Konten & Session
     ===================================================== */
  const isAdmin = u => !!u && u.name.toLowerCase() === ADMIN_NAME;
  function findUser(name) {
    const n = String(name || '').trim().toLowerCase();
    return users.find(u => u.name.toLowerCase() === n) || null;
  }
  function me() {
    const s = localStorage.getItem(KEYS.session);
    return s ? findUser(s) : null;
  }
  function login(u) { localStorage.setItem(KEYS.session, u.name); }
  function logout() {
    localStorage.removeItem(KEYS.session);
    toast(t('auth.loggedOut'));
    go('#/');
  }
  function canSee(m, user) {
    return statusOf(m) === 'approved' || (!!user && (isAdmin(user) || sameName(user.name, m.author)));
  }
  function findMod(id) { return mods.find(m => m.id === id) || null; }

  /* =====================================================
     Router
     ===================================================== */
  let pendingNext = null;
  function go(hash) {
    if (location.hash === hash) render();
    else location.hash = hash;
  }
  function needLogin(next) {
    pendingNext = next;
    toast(t('auth.needLogin'));
    go('#/login');
  }
  function afterAuth() {
    const n = pendingNext || '#/';
    pendingNext = null;
    return n;
  }
  function parseRoute() {
    let raw = '';
    try { raw = decodeURIComponent(location.hash.replace(/^#\/?/, '')); } catch (e) { raw = ''; }
    const parts = raw.split('/').filter(Boolean);
    return { name: parts[0] || 'home', arg: parts[1] || '' };
  }

  function renderAuthArea(user) {
    const el = $('#authArea');
    if (!user) {
      el.innerHTML = `<a class="btn ghost small" href="#/login">${esc(t('auth.login'))}</a><a class="btn small" href="#/register">${esc(t('auth.register'))}</a>`;
      return;
    }
    el.innerHTML = `
      <a class="authbox" href="#/profile">
        <span class="avatar" style="background:${gradientFor(user.name)}">${initial(user.name)}</span>
        <span style="font-weight:700">${esc(user.name)}</span>
      </a>
      <button class="btn ghost small" id="logoutBtn">${esc(t('auth.logout'))}</button>`;
    $('#logoutBtn').addEventListener('click', logout);
  }

  function render() {
    const route = parseRoute();
    const user = me();
    const admin = isAdmin(user);

    applySettings();
    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll('[data-i18n-title]').forEach(el => {
      el.title = t(el.dataset.i18nTitle);
      el.setAttribute('aria-label', t(el.dataset.i18nTitle));
    });
    document.querySelectorAll('[data-nav]').forEach(a => {
      const on = a.dataset.nav === route.name || (route.name === 'mod' && a.dataset.nav === 'home');
      a.classList.toggle('active', on);
    });
    $('[data-nav="admin"]').classList.toggle('hidden', !admin);
    renderAuthArea(user);

    let view;
    switch (route.name) {
      case 'home': view = viewHome(); break;
      case 'mod': view = viewMod(route.arg); break;
      case 'login':
      case 'register':
        if (user) { go('#/'); return; }
        view = viewAuth(route.name); break;
      case 'upload':
        if (!user) { needLogin('#/upload'); return; }
        view = viewUpload(); break;
      case 'modpacks':
        if (!user) { needLogin('#/modpacks'); return; }
        view = viewModpacks(user); break;
      case 'profile':
        if (!user) { needLogin('#/profile'); return; }
        view = viewProfile(user); break;
      case 'settings':
        view = viewSettings(); break;
      case 'admin':
        if (!admin) { toast(t('admin.noAccess')); go('#/'); return; }
        view = viewAdmin(); break;
      default:
        view = { html: `<div class="card empty"><h2>${esc(t('notfound.title'))}</h2><p style="margin-top:10px"><a href="#/">${esc(t('notfound.link'))}</a></p></div>` };
    }

    $('#app').innerHTML = `<div class="page">${view.html}</div>`;
    if (view.bind) view.bind();
  }

  function drawMarquee() {
    const track = $('#modMarquee');
    if (!track) return;
    const list = mods.filter(m => statusOf(m) === 'approved')
      .slice().sort((a,b) => (b.downloads || 0) - (a.downloads || 0));
    if (!list.length) { track.innerHTML = ''; return; }
    const cards = list.map(m => `<a class="marquee-card" href="#/mod/${esc(m.id)}">
      <span class="icon" style="background:${gradientFor(m.name)}">${initial(m.name)}</span>
      <span><strong>${esc(m.name)}</strong><small>${esc(T(m,'summary') || catLabel(m.category))}</small></span>
    </a>`).join('');
    track.innerHTML = cards + cards;
  }

  function drawGrid() {
    const grid = $('#grid');
    if (!grid) return;
    const q = filters.q.trim().toLowerCase();
    let list = mods.filter(m =>
      statusOf(m) === 'approved' &&
      (filters.cat === 'all' || m.category === filters.cat) &&
      (!q || [m.name, T(m, 'summary'), m.author, catLabel(m.category), m.loader].join(' ').toLowerCase().includes(q)));
    // Mehrere Versionen derselben Mod desselben Uploaders erscheinen als ein Eintrag.
    const grouped = new Map();
    list.forEach(m => {
      const key = `${String(m.author || '').toLowerCase()}::${String(m.name || '').trim().toLowerCase()}`;
      const current = grouped.get(key);
      if (!current || (m.created || 0) > (current.created || 0)) grouped.set(key, m);
    });
    list = [...grouped.values()];
    const sorters = {
      popular: (a, b) => (b.downloads || 0) - (a.downloads || 0),
      new: (a, b) => (b.created || 0) - (a.created || 0),
      name: (a, b) => a.name.localeCompare(b.name, locale())
    };
    list = list.slice().sort(sorters[filters.sort] || sorters.popular);
    grid.innerHTML = list.length
      ? list.map((m, i) => modCard(m, i)).join('')
      : `<div class="card empty" style="grid-column:1/-1">${esc(t('home.empty'))}</div>`;
  }

  /* =====================================================
     Mod-Detailseite
     ===================================================== */
  function viewMod(id) {
    const user = me();
    const m = findMod(id);
    if (!m || !canSee(m, user)) {
      return { html: `<div class="card empty"><h2>${esc(t('mod.notFound'))}</h2><p style="margin-top:10px"><a href="#/">${esc(t('mod.backPlain'))}</a></p></div>` };
    }

    if (st === 'pending') banner = `<div class="banner pending">${esc(t('mod.pendingBanner'))}</div>`;
    if (st === 'rejected') {

         </div>`

    // Versions gehören nur dann zusammen, wenn Mod-Name UND Uploader übereinstimmen.
    const relatedVersions = mods.filter(v =>
      sameName(v.author, m.author) &&
      String(v.name || '').trim().toLowerCase() === String(m.name || '').trim().toLowerCase() &&

    const hasMultipleVersions = relatedVersions.length > 1;
    const versionPanel = relatedVersions.map(v => `
      <div class="version-row">
        <div class="version-meta">

          ${statusOf(v) !== 'approved' ? statusBadge(v) : ''}
        </div>
        ${statusOf(v) === 'approved' ? `<button class="btn small" data-action="download" data-id="${esc(v.id)}">${esc(t('mod.download'))}</button>` : `<span class="hint">${esc(statusOf(v) === 'pending' ? t('mod.pendingBanner') : t('mod.rejectedBanner'))}</span>`}
      </div>`).join('');

    return {
      html: `
        <a href="#/" class="muted" style="font-weight:700">${esc(t('mod.back'))}</a>
        <div class="detail">
          <div class="card">
            <div class="modhead">
              <div class="icon big" style="background:${gradientFor(m.name)}">${initial(m.name)}</div>
              <div>
                <h1 class="title">${esc(m.name)}</h1>

              <span class="tag">${esc(m.loader)}</span>
              <span class="tag">MC ${esc(m.version)}</span>
              ${st !== 'approved' ? statusBadge(m) : ''}
            </div>
            ${hasMultipleVersions ? `<div class="tabs" style="margin-top:22px;margin-bottom:14px"><button type="button" class="on" data-action="mod-version-tab" data-pane="description">${esc(t('mod.description'))}</button><button type="button" data-action="mod-version-tab" data-pane="versions">Versions (${relatedVersions.length})</button></div>` : `<h2 class="sub">${esc(t('mod.description'))}</h2>`}
            <section data-mod-panel="description"><div class="desc">${esc(T(m, 'description') || t('mod.noDesc'))}</div></section>

          </aside>
        </div>`

  async function downloadMod(id) {
    const m = findMod(id);
    if (!m) return;
    const user = me();
    const allowed = statusOf(m) === 'approved' || (!!user && (isAdmin(user) || sameName(user.name, m.author)));
    if (!allowed) return;
    try {
      if (m.hasFile) {
        const blob = await getFile(m.id);
        if (!blob) throw new Error('missing');
        triggerDownload(blob, m.fileName || (safeFileName(m.name) + '.jar'));
      } else if (m.url) {
        window.open(m.url, '_blank', 'noopener');
      } else {
        toast(t('mod.demoNoFile'));
        return;
      }
    } catch (e) {
      toast(t('mod.fileMissing'));
      return;
    }
    if (statusOf(m) === 'approved') {
      m.downloads = (m.downloads || 0) + 1;
      saveMods();
    }
    const c = $('#dlCount');
    if (c) c.textContent = fmt(m.downloads);
    toast(t('mod.started'));
  }

  async function removeMod(id) {
    mods = mods.filter(m => m.id !== id);
    modpacks.forEach(p => { p.mods = p.mods.filter(x => x !== id); });
    saveMods();
    savePacks();
    await delFile(id);
  }

  /* =====================================================
     Login & Registrierung
     ===================================================== */
  function viewAuth(mode) {
    const isLogin = mode === 'login';
    return {
      html: `
        <div class="narrow" style="max-width:440px;margin-top:20px">
          <div class="card auth">
            <div class="auth-brand">
              <div class="brand big">LowMods</div>
              <p class="muted">${esc(isLogin ? t('auth.loginTitle') : t('auth.registerTitle'))}</p>
            </div>
            <div class="tabs">
              <button data-go="#/login" class="${isLogin ? 'on' : ''}">${esc(t('auth.tabLogin'))}</button>
              <button data-go="#/register" class="${isLogin ? '' : 'on'}">${esc(t('auth.tabRegister'))}</button>
            </div>
            <div class="error" id="authErr"></div>
            <form id="authForm" novalidate>
              <div class="field">
                <label for="a_name">${esc(t('auth.username'))}</label>
                <input id="a_name" maxlength="16" autocomplete="username" placeholder="Pixelking">
                ${isLogin ? '' : `<span class="hint">${esc(t('auth.usernameHint'))}</span>`}
              </div>
              <div class="field">
                <label for="a_pw">${esc(t('auth.password'))}</label>
                <input id="a_pw" type="password" autocomplete="${isLogin ? 'current-password' : 'new-password'}" placeholder="••••••">
              </div>
              ${isLogin ? '' : `
              <div class="field">
                <label for="a_pw2">${esc(t('auth.password2'))}</label>
                <input id="a_pw2" type="password" autocomplete="new-password">
              </div>`}
              <button class="btn" type="submit" style="width:100%">${esc(isLogin ? t('auth.submitLogin') : t('auth.submitRegister'))}</button>
            </form>
          </div>
        </div>`,
      bind() {
        document.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => go(b.dataset.go)));
        $('#authForm').addEventListener('submit', e => {
          e.preventDefault();
          const name = $('#a_name').value.trim();
          const pw = $('#a_pw').value;

          if (isLogin) {
            if (!name || !pw) return showError('authErr', t('auth.errEmpty'));
            const u = findUser(name);
            if (!u) return showError('authErr', t('auth.errNoAccount'));
            if (u.password !== pw) return showError('authErr', t('auth.errWrongPw'));
            login(u);
            toast(t('auth.welcomeBack', { name: u.name }));
            go(afterAuth());
            return;
          }

          const pw2 = $('#a_pw2').value;
          if (!NAME_RE.test(name)) return showError('authErr', t('auth.errNameFormat'));
          if (findUser(name)) return showError('authErr', t('auth.errTaken'));
          if (pw.length < 4) return showError('authErr', t('auth.errPwLen'));
          if (pw !== pw2) return showError('authErr', t('auth.errPwMatch'));

          const u = { name, password: pw, created: Date.now() };
          users.push(u);
          saveUsers();
          login(u);
          toast(t('auth.welcomeNew', { name: u.name }));
          go(afterAuth());
        });
      }
    };
  }

  /* =====================================================
     Mod hochladen
     ===================================================== */
  function viewUpload() {
    return {
      html: `

          const summary = $('#f_sum').value.trim();
          const description = $('#f_desc').value.trim();

          if (name.length < 3) return showError('formErr', t('upload.errName'));
          if (summary.length < 10) return showError('formErr', t('upload.errSummary'));
          if (!url && !file) return showError('formErr', t('upload.errSource'));
          if (url && !/^https:\/\/\S+$/i.test(url)) return showError('formErr', t('upload.errLink'));
          if (file) {
            if (!/\.jar$/i.test(file.name)) return showError('formErr', t('upload.errType'));
            if (file.size > MAX_FILE) return showError('formErr', t('upload.errSize'));
            // Vor dem Schreiben prüfen, ob der Browser voraussichtlich genug IndexedDB-Speicher hat.
            if (navigator.storage && navigator.storage.estimate) {
              try {
                const estimate = await navigator.storage.estimate();
                const available = (estimate.quota || 0) - (estimate.usage || 0);
                if (available > 0 && file.size > available) return showError('formErr', t('upload.errStorage'));
              } catch (_) { /* Die tatsächliche Speicherung wird unten geprüft. */ }
            }
          }

          const admin = isAdmin(user);
          const mod = {
            id: uid(), name, summary, description,
            category: $('#f_cat').value, loader: $('#f_loader').value, version: $('#f_ver').value,
            url, author: user.name, downloads: 0, created: Date.now(),
            status: admin ? 'approved' : 'pending',
            hasFile: false, fileName: '', fileSize: 0
          };

          if (file) {
            try {
              await putFile(mod.id, file);
              mod.hasFile = true;
              mod.fileName = file.name;
              mod.fileSize = file.size;
            } catch (err) {
              return showError('formErr', t('upload.errStorage'));
            }
          }

          mods.unshift(mod);
          saveMods();
          toast(admin ? t('upload.submittedAdmin') : t('upload.submittedPending'));
          go(admin ? '#/mod/' + mod.id : '#/profile');
        });
      }
    };
  }

  /* ZIP-START */
  const CRC_TABLE = (function () {
    const tbl = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      tbl[n] = c >>> 0;
    }
    return tbl;
  })();
  function crc32(data) {
    let c = 0xFFFFFFFF;
    for (let i = 0; i < data.length; i++) c = CRC_TABLE[(c ^ data[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }
  function makeZip(entries) {
    const enc = new TextEncoder();
    const parts = [];
    const central = [];
    let offset = 0;
    const d = new Date();
    const dosTime = ((d.getHours() & 31) << 11) | ((d.getMinutes() & 63) << 5) | (Math.floor(d.getSeconds() / 2) & 31);
    const dosDate = (((d.getFullYear() - 1980) & 127) << 9) | (((d.getMonth() + 1) & 15) << 5) | (d.getDate() & 31);
    for (const e of entries) {
      const name = enc.encode(e.name);
      const data = e.data;
      const crc = crc32(data);
      const size = data.length;

      const lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0, 0x04034b50, true);
      lh.setUint16(4, 20, true);
      lh.setUint16(6, 0x0800, true);
      lh.setUint16(8, 0, true);
      lh.setUint16(10, dosTime, true);
      lh.setUint16(12, dosDate, true);
      lh.setUint32(14, crc, true);
      lh.setUint32(18, size, true);
      lh.setUint32(22, size, true);
      lh.setUint16(26, name.length, true);
      lh.setUint16(28, 0, true);
      parts.push(new Uint8Array(lh.buffer), name, data);

      const ch = new DataView(new ArrayBuffer(46));
      ch.setUint32(0, 0x02014b50, true);
      ch.setUint16(4, 20, true);
      ch.setUint16(6, 20, true);
      ch.setUint16(8, 0x0800, true);
      ch.setUint16(10, 0, true);
      ch.setUint16(12, dosTime, true);
      ch.setUint16(14, dosDate, true);
      ch.setUint32(16, crc, true);
      ch.setUint32(20, size, true);
      ch.setUint32(24, size, true);
      ch.setUint16(28, name.length, true);
      ch.setUint16(30, 0, true);
      ch.setUint16(32, 0, true);
      ch.setUint16(34, 0, true);
      ch.setUint16(36, 0, true);
      ch.setUint32(38, 0, true);
      ch.setUint32(42, offset, true);
      central.push(new Uint8Array(ch.buffer), name);

      offset += 30 + name.length + size;
    }
    const centralSize = central.reduce((s, p) => s + p.length, 0);
    const end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true);
    end.setUint16(4, 0, true);
    end.setUint16(6, 0, true);
    end.setUint16(8, entries.length, true);
    end.setUint16(10, entries.length, true);
    end.setUint32(12, centralSize, true);
    end.setUint32(16, offset, true);
    end.setUint16(20, 0, true);
    return new Blob([...parts, ...central, new Uint8Array(end.buffer)], { type: 'application/zip' });
  }
  /* ZIP-END */

  async function buildModpack(pack) {
    const enc = new TextEncoder();
    const picked = pack.mods.map(findMod).filter(m => m && statusOf(m) === 'approved');
    const entries = [];
    const links = [];
    const used = new Set();
    let fileCount = 0;
    let skipped = 0;
    toast(t('modpack.building'));

    for (const m of picked) {
      if (m.hasFile) {
        let blob = null;
        try { blob = await getFile(m.id); } catch (e) { blob = null; }
        if (blob) {
          let fname = safeFileName(m.fileName || (m.name + '.jar'));
          if (used.has(fname)) fname = m.id + '_' + fname;
          used.add(fname);
          entries.push({ name: 'overrides/mods/' + fname, data: new Uint8Array(await blob.arrayBuffer()) });
          fileCount++;
          continue;
        }
      }
      if (m.url) links.push(m.name + ': ' + m.url);
      else skipped++;
    }

    const index = {
      formatVersion: 1,
      game: 'minecraft',
      versionId: '1.0.0',
      name: pack.name,
      summary: pack.description || '',
      files: [],
      dependencies: { minecraft: pack.version }
    };
    entries.unshift(
      { name: 'modrinth.index.json', data: enc.encode(JSON.stringify(index, null, 2)) },
      { name: 'README.txt', data: enc.encode(buildReadme(pack, fileCount, links.length, skipped)) }
    );
    if (links.length) entries.push({ name: 'mods-links.txt', data: enc.encode(links.join('\n') + '\n') });

    triggerDownload(makeZip(entries), safeFileName(pack.name) + '.mrpack');
    toast(t('modpack.done') + (skipped ? ' ' + t('modpack.skipped', { n: skipped }) : ''));
  }

     Prüfung: Dateiinhalt, lokaler Scan, KI-Check, VirusTotal
